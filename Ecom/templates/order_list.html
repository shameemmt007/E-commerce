{% extends "base.html" %}

{%block content%}

<h2>My orders</h2>

{% if orders %}
    <ul>
        {% for order in orders %}
        <li>
            <a href="{% url 'order_detail' order.id%}">Order{{order.id}}</a>
            status: {{order.status}}
            plased on: {{ order.created_at|date:"Y-m-d H:i" }} 
        </li>
        {% endfor %}
    </ul>
    {% else %}
        <p>you have not plased any orders yet.</p>
    {% endif %}
    {% endblock %}
