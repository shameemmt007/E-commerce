{%extends 'base.html'%}
{%block content%}

<table>
    <tr>
        <th>PRODUCT NAME</th>
        <th></th>
    </tr>
        {%for i in products%}
            <tr>
                <td><a href="{%url 'product_details' i.id%}"><p>{{i.name}}</p></a>
                <img src="{{i.image}}"height="250px"width="250px"></td>
                <td><a href="{%url 'addtocart' i.id%}">add to cart</a></td>
            </tr>
        {%endfor%}
</table>


<style>
    table,tr,td,th{
        border: 1.7px solid black;
        border-collapse: collapse;
        padding: 60px;
    }
</style>


{%endblock%}
