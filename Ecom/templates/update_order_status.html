{%extends 'base.html'%}

{%block content%}

<h2>update orders -- {{ order.id}}</h2>

<form method="post">
    {%csrf_token%}
    <label>status:</label>
    <select name="status">
        {% for key, label in order.STATUS_CHOICES %}
        <option value="{{ key }}" {% if order.status == key %}selected{%endif%}>{{ label }}</option>
        {%endfor%}
    </select>
    <button type="submit">save</button>
</form>


{%endblock%}
