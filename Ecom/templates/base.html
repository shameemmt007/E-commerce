<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</head>
<header>
    <nav class="navbar navbar-expand-lg bg-dark-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">E-store</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavDropdown">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="{%url 'store_homepage'%}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{%url 'all_products'%}">Products</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{%url 'login_page'%}">Login</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{%url 'register'%}">Register</a>
        </li>
         <li class="nav-item">
          <a class="nav-link" href="{%url 'order_list'%}">my orders</a>
        </li>
        {%if request.user.is_authenticated%}
        <li class="nav-item">
          <a class="nav-link" href="{%url 'logout_page'%}">Logout</a>
        </li>
        <li class="nav-item">
          <a class="nav-link">{{request.user}}</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{%url 'viewcart'%}">Cart</a>
        </li>
         <li class="nav-item">
          <a class="nav-link" href="{%url 'profile_page'%}">profile</a>
        </li>
        {%endif%}
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>


</header>




<body>
    <div class="main">
        {%block content%}
        {%endblock%}
    </div>
</body>
</html>
